name: Tennis Court Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  check-courts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run court checker script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLUB_EMAIL: ${{ secrets.CLUB_EMAIL }}
          CLUB_PASSWORD: ${{ secrets.CLUB_PASSWORD }}
        run: python check_courts.py

      - name: Save memory file
        run: |
          git config --global user.name "Court Bot"
          git config --global user.email "bot@://github.com"
          git add seen_courts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen courts" && git push)

